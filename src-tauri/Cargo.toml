[package]
name = "focusflow"
version = "0.1.0"
description = "FocusFlow — Focus, Google Tasks & Google Calendar Desktop App (Rust/Tauri)"
authors = ["FocusFlow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "custom-protocol"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
tauri-plugin-global-shortcut = "2"
